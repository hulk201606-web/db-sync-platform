name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 真实库 E2E 较重，手动触发即可；本地也可用 `docker compose up -d --build && ./scripts/smoke-real-db.sh`
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 17 / mvn clean test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Full test suite
        run: mvn -B clean test
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: db-sync-console/package-lock.json
      - name: Install
        run: npm ci
        working-directory: db-sync-console
      - name: TypeScript strict typecheck
        run: npm run typecheck
        working-directory: db-sync-console
      - name: Production build
        run: npm run build
        working-directory: db-sync-console

  real-db-e2e:
    name: Real MySQL 8 + PostgreSQL smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [backend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait & verify real-DB migration + auth
        run: |
          chmod +x scripts/smoke-real-db.sh
          ./scripts/smoke-real-db.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color app mysql
      - name: Teardown
        if: always()
        run: docker compose down -v
